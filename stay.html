<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>숙소 · Airbnb 와타나베도리</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="wrap">
    <p class="back"><a href="index.html">← 홈으로</a></p>

    <section class="card flight-block">
      <div class="flight-head">
        <div>
          <div class="tag">Airbnb · 2박</div>
        </div>
        <span class="badge ok-badge">9/25–26</span>
      </div>

      <div class="leg">
        <div class="leg-label"> 주소</div>
        <p class="addr stay-addr">福岡市中央区渡辺通1丁目9-2</p>
        <p class="meta" style="margin-top:8px">1-chōme-9-2 Watanabedōri, Chuo-ku, Fukuoka 810-0004</p>
      </div>

      <div class="map-widget stay-map">
        <iframe
          title="숙소 위치"
          src="https://maps.google.com/maps?q=福岡市中央区渡辺通1丁目9-2&hl=ko&z=17&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen></iframe>
      </div>

      <dl class="kv codes">
        <dt>체크인</dt>
        <dd>15:00</dd>
        <dt>체크아웃</dt>
        <dd>11:00</dd>
        <dt>근처 역</dt>
        <dd>나나쿠마선 와타나베도리</dd>
        <dt>도보권</dt>
        <dd>텐진 · 니시테츠 후쿠오카(텐진)</dd>
      </dl>
    </section>

    <p class="back back-bottom"><a href="index.html">← 홈으로</a></p>
  </main>
</body>
</html>
